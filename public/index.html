<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Қалқан</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&family=Noto+Serif:wght@700&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="wrap">
      <span class="brand">Қалқан</span>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-l="kk" aria-pressed="true">ҚАЗ</button>
        <button type="button" data-l="ru" aria-pressed="false">РУС</button>
        <button type="button" data-l="en" aria-pressed="false">ENG</button>
      </div>
    </div>
  </header>
  <main class="wrap">
    <h1 data-i18n="h1"></h1>
    <p class="lead" data-i18n="lead"></p>
    <form>
      <input id="url" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="255" aria-label="URL" required>
      <button class="go" type="submit" data-i18n="btn"></button>
    </form>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <section id="result" aria-live="polite"></section>
    <p class="note" data-i18n="note"></p>
  </main>
  <footer class="wrap" data-i18n="foot"></footer>
  <script src="/app.js"></script>
</body>
</html>
